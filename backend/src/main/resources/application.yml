server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/certifind_db
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: never

  # Schema and reference data are Flyway migrations in src/main/resources/db/migration.
  # Company data is not: load it from data/ with the "import" profile (see README).
  flyway:
    enabled: true
    locations: classpath:db/migration
