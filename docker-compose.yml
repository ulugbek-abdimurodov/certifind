services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: certifind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-certifind_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d certifind_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      certifind-net:
        aliases:
          - postgres
          - certifind-postgres

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: certifind-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/certifind_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      DB_URL: jdbc:postgresql://postgres:5432/certifind_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      certifind-net:
        aliases:
          - backend
          - certifind-backend

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    container_name: certifind-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      certifind-net:
        aliases:
          - frontend
          - certifind-frontend

  caddy:
    image: caddy:2-alpine
    container_name: certifind-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      certifind-net:
        aliases:
          - caddy
          - certifind-gateway

volumes:
  pgdata:
    name: certifind_pgdata
  caddy_data:
  caddy_config:

networks:
  certifind-net:
    driver: bridge
