# Profile for the CSV importer (com.certifind.importer.ImportRunner): no web server,
# the process exits once the import finishes. Paths are relative to backend/.
spring:
  main:
    web-application-type: none
    banner-mode: off
    log-startup-info: false
  jpa:
    show-sql: false

# Only warnings/errors from frameworks; keep the importer's own summary.
logging:
  level:
    root: WARN
    com.certifind.importer: INFO
  pattern:
    console: "%msg%n"

certifind:
  import:
    paths: ../data
    dry-run: false
