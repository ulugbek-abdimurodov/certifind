server:
  port: 8080
  # JSON lists compress roughly 10-20x; responses under 2 KB are sent as-is.
  compression:
    enabled: true
    mime-types: application/json,text/plain
    min-response-size: 2048

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/certifind_db
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: never

  # Schema and reference data are Flyway migrations in src/main/resources/db/migration.
  # Company data is not: load it from data/ with the "import" profile (see README).
  flyway:
    enabled: true
    locations: classpath:db/migration

certifind:
  cors:
    # Local development: the Next.js dev server. Production overrides this (application-prod.yml).
    allowed-origins: ${CERTIFIND_CORS_ALLOWED_ORIGINS:http://localhost:3000}
