services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: certifind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-certifind_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # The backend schema is the single source of truth. Seed scripts run
      # after it in lexical order.
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./init-db/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./init-db/03-expanded-seed.sql:/docker-entrypoint-initdb.d/03-expanded-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-certifind_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
    name: certifind_pgdata
